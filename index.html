<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script type="module" src="assets/js/script.js"></script>
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="text-center py-3">
        <div>
            <h1>La mia libreria personale</h1>
            <p>Aggiungi i tuoi libri e segnali come letti.</p>
        </div>
    </header>
    <main class="container">
        <section class="container d-flex justify-content-center">
            <form action="" class="row card w-50 p-3 gy-3 mt-3">
                

                    <div >
                        <label for="titleBook">Titolo</label>
                        <input class="col-12" type="text" name="titleBook" id="titleBook">
                    </div>
                    <div >
                        <label for="autorBook">Autore</label>
                        <input class="col-12" type="text" name="autorBook" id="autorBook">
                    </div>
                    <div >
                        <label for="yearBook">anno</label>
                        <input class="col-12" type="number" name="yearBook" id="yearBook">
                    </div>
                    <div >
                        <label for="sectionFormat">Formato</label>
                        <select class="col-12" name="sectionFormat" id="sectionFormat">
                            <option value="" ></option>
                            <option value="cartaceo">Cartaceo</option>
                            <option value="digitale">Digitale</option>
                        </select>
                    </div>
                    <div id="inputDimensioni" class="d-none">
                        <label for="dimensioniBook">Dimensioni (MB)</label>
                        <input class="col-12" type="number" step="any" min="0" name="dimensioniBook" id="dimensioniBook">
                    </div>

                    <div class="mt-3">
                        <button class="btn btn-primary" type="submit" id="btnAggiungi">Aggiungi</button>
                    </div>
                
                </form>
        </section>
        <section class="container">
            <div class="d-flex mt-4 "> 
            <h1>I tuoi libri(<span id="numBook"></span>)</h1>
                <button id="svuotaLibri" class="btn btn-primary mx-auto">Svuota Libreria</button>
            </div>
            <div class="mt-3">
                <ul id="ulBook"></ul>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>
</html>
